services:
  - type: web
    name: facevo-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATA_DIR
        value: /var/lib/facevo
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: YTDLP_PATH
        value: /usr/local/bin/yt-dlp
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AUTO_PUBLISH_ON_AI_APPROVE
        value: "false"
    disk:
      name: facevo-data
      mountPath: /var/lib/facevo
      sizeGB: 10
