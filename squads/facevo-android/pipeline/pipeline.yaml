id: "facevo-android"
name: "FaceVo Android"
version: "1.0.0"
description: "Implementacao incremental e revisao do aplicativo Android FaceVo."

steps:
  - id: "1"
    name: "confirmar-escopo"
    type: "checkpoint"
    file: "steps/step-01-confirmar-escopo.md"
    outputFile: "squads/facevo-android/output/escopo.md"
  - id: "2"
    name: "implementar-catalogo"
    type: "agent"
    agent: "dados"
    file: "steps/step-02-implementar-catalogo.md"
    inputFile: "squads/facevo-android/output/escopo.md"
    outputFile: "squads/facevo-android/output/dados.md"
  - id: "3"
    name: "implementar-feed"
    type: "agent"
    agent: "feed"
    file: "steps/step-03-implementar-feed.md"
    inputFile: "squads/facevo-android/output/dados.md"
    outputFile: "squads/facevo-android/output/feed.md"
  - id: "4"
    name: "validar-experiencia"
    type: "agent"
    agent: "acessibilidade"
    file: "steps/step-04-validar-experiencia.md"
    inputFile: "squads/facevo-android/output/feed.md"
    outputFile: "squads/facevo-android/output/experiencia.md"
  - id: "5"
    name: "revisar-entrega"
    type: "agent"
    agent: "revisao"
    file: "steps/step-05-revisar-entrega.md"
    inputFile: "squads/facevo-android/output/experiencia.md"
    outputFile: "squads/facevo-android/output/revisao.md"
    on_reject: "2"
  - id: "6"
    name: "aprovar-entrega"
    type: "checkpoint"
    file: "steps/step-06-aprovar-entrega.md"

checkpoints:
  - "1"
  - "6"

completion:
  success_step: "6"
  review_step: "5"
  maximum_revision_cycles: 3
